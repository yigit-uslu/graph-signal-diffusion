# @package model
name: unet
_target_: graph_signal_diffusion.models.unet.UNet

# Architecture
in_channels: 1
obs_channels: 8
out_channels: 1
channels: 64
channel_multipliers: [1, 2, 2, 2]
in_timesteps: ${dataset.model_in_timesteps}
obs_timesteps: ${dataset.model_obs_timesteps}
out_timesteps: ${dataset.model_out_timesteps}
num_res_blocks: 2
attention_resolutions: [16, 8]
dropout: 0.1

# Time embedding
time_embed_dim: 32

# Conditioning
num_classes: null  # set to 10 for class-conditional generation