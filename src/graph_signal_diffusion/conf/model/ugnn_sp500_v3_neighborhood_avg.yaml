# @package model
defaults:
  - ugnn_sp500_v2_learned_ds2
  - _self_

# ---------------------------------------------------------------------------
# UGNN SP500 V3 + Neighborhood Avg-Pooling
# ---------------------------------------------------------------------------
#
# Purpose:
#   Exercise the NeighborhoodFeaturePooling code path with AVG aggregation
#   combined with V3 learned node selection on the SP500/SP500-cleaned dataset.
#
#   Inherits all V3 selector settings from ugnn_sp500_v2_learned_ds2.yaml
#   (selector_version: v3, cross-attention conditioning fusion, STE selection,
#   cosine temperature schedule, EMA temporal score aggregation).
#
#   Compared to the ..._neighborhood_max.yaml variant, avg-pooling produces
#   smooth neighborhood means instead of retaining the strongest feature.
#   This may be preferable when the signal has high variance and you want
#   local smoothing before node selection.
#
# Two-stage pipeline per pooling layer:
#   Stage 1: NeighborhoodFeaturePooling — avg-pool features over the union
#            of k·stride-hop neighborhoods (k = 0, 1, …, pool_K).
#            Only active neighbors contribute to the mean (inactive nodes
#            are masked out and excluded from the denominator).
#   Stage 2: V3 learned node selector — select which nodes to retain.
#
# Adjustable knobs:
#   pool_K: Number of neighborhood scales (default 1).
#       - K=0: no neighborhood aggregation (identity).
#       - K=1: 0-hop + stride_input-hop (2 scales, moderate).
#       - K=2: 0-hop + stride-hop + 2·stride-hop (3 scales).
#
#   neighborhood_pooling: 'max' or 'avg'.
#       - 'avg': smooth neighborhood mean (this config).
#       - 'max': strongest feature per neighborhood (see ..._neighborhood_max.yaml).
#
#   neighborhood_include_self: Whether nodes include themselves in the
#       neighborhood union. Default true. Set false to aggregate ONLY from
#       neighbors, producing a pure "context" signal without the node's own
#       features. Useful for ablation studies.
#
#   neighborhood_max_dense_gb: Memory guard for the (B, T, N, N, F) dense
#       intermediate. Default 8.0 GB. Increase for larger batches.
#
#   All parent knobs (selector temperature, entropy regularization, score
#   gain, EMA alpha, etc.) remain tunable — see ugnn_sp500_v2_learned_ds2.yaml.
# ---------------------------------------------------------------------------
name: ugnn_sp500_v3_neighborhood_avg

config:

  pooling_config:
    # Activate neighborhood feature aggregation (parent uses pool_K=0).
    pool_K: 1

    # --- Neighborhood Feature Pooling knobs ---
    neighborhood_pooling: 'avg'          # Avg aggregation over multi-hop neighborhoods.
    neighborhood_include_self: true      # Include self-loop in neighborhood union.
    neighborhood_max_dense_gb: 8.0       # Memory guard (GB) for dense (B,T,N,N,F) intermediate.
