# @package task
defaults:
  - /dataset: sp500_cleaned
  - /model: ugnn_sp500_v3_ds8
  - /diffusion: ddim
  - /trainer: trainer_sp500_v3_learned_ds8
  - _self_

# Stock price forecasting v3 — DS8 variant: learned 4-level [1,2,2,2]
# downsampling, 8x bottleneck compression, 2-layer bottleneck, dropout=0.10,
# cross-attention conditioning, per-layer temporal mixer + self-attention.
#
# Diverges from stock_price_forecasting_v3 only via the model and trainer
# defaults pointing to the DS8 variants. Diffusion and dataset defaults are
# unchanged.
name: stock_price_forecasting_v3_learned_ds8
_target_: graph_signal_diffusion.tasks.stock_price_forecasting.evaluator.StockPriceForecastingTaskV2
forecast_horizon: ${dataset.future_window}
n_samples_per_input: ${oc.select:trainer.n_samples_per_input, 10}

# Valid datasets for this task
valid_datasets: [sp500, sp500_cleaned, sp100]
