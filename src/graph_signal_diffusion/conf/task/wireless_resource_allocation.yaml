# @package task
defaults:
  - /dataset: wra_debug # default dataset for this task
  - /model: ugnn_wra
  - /diffusion: ddim_wra
  - /trainer: trainer_wra_debug
  - _self_
  
name: wireless_resource_allocation
_target_: graph_signal_diffusion.tasks.wireless_resource_allocation.evaluator.WirelessResourceAllocationTask

# Valid datasets for this task
valid_datasets: [wra]

# Evaluation parameters
num_channel_realizations: 500  # Number of precomputed H_instantaneous slots required for rate evaluation
ergodic_window_size: 5  # T_0
num_eval_batches: 10  # Statistical robustness
eval_h_chunk_size: 50  # Number of timesteps transferred per GPU chunk during slot evaluation
eval_h_cache_budget_gb: 2.0  # Max memory (GB) for in-memory H pool cache (LRU eviction beyond this)
h_io_mode: auto  # auto|legacy: use mmap sidecar when available, fallback to legacy per-timeslot files
h_sidecar_filename: H_instantaneous_tmn.npy  # Contiguous (T,m,n) sidecar filename inside H_instantaneous/


# Plotting behavior 
plot_style:
  plots:
    selector_rate_correlation:
      enabled: true
      max_networks_per_dataset: 1
      probe_timestep_fraction: 0.1  # Average sampling selection_given_available over probe timesteps with t <= fraction * T_max
      # Aggregate (deep-level selection freq vs ergodic rate POOLED across all
      # networks): one figure per density, plus an optional global one. Pools
      # ALL networks regardless of max_networks_per_dataset above.
      aggregate:
        enabled: true
        global_enabled: true          # also emit one figure across all densities
        num_bins: 15                  # rate bins for the mean ± std trend panel
        min_networks: 1               # skip a density with fewer pooled networks
        filename_template_density: selector_rate_correlation_aggregate_d{dataset_name}.pdf
        filename_template_global: selector_rate_correlation_aggregate_global.pdf

    task_power_scatter:
      max_networks_per_dataset: 1

    task_rate_evolution:
      max_networks_per_dataset: 1

    
