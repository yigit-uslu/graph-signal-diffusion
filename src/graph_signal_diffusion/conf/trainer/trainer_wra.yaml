# @package trainer
defaults:
  - default
  - _self_

# Wireless Resource Allocation trainer overrides.
name: gdm_wra

optimizer:
  name: adamw
  learning_rate: 0.0001 # A peak lr of 1e-4
  betas: [0.9, 0.98]   # Used by Adam/AdamW only
  weight_decay: 1e-4     # Used by Adam/AdamW/SGD
  momentum: 0.9         # Used by SGD only

lr_scheduler:
  enabled: true
  name: cosine      # Linear warmup + cosine decay
  warmup_ratio: 0.01       # Warmup for 1.0% of total optimizer steps
  min_lr_ratio: 0.01       # Final LR is 1% of peak LR
  decay_fraction: 0.8     # Decay completes at 80% of total training steps, then holds at min_lr_ratio for the remaining epochs

max_epochs: 5000
# batch_size: ${dataset.batch_size}
log_every_n_steps: 100
eval_every_n_epochs: 50    # Legacy fallback; eval_schedule below takes precedence.
eval_schedule:
  # type: uniform
  # period: ${trainer.eval_every_n_epochs}
  # eval_on_first_epoch: false
  # eval_on_last_epoch: true
  type: multi_phase
  eval_on_first_epoch: false
  eval_on_last_epoch: true
  phases:
    - period: 10       # eval every 10 epochs for the first 100 epochs
      until_epoch: 100
    - period: ${trainer.eval_every_n_epochs}      # eval every 50 epochs until the last 100 epochs
      until_epoch: -100   # resolves to (max_epochs - 100)
    - period: 10       # eval every 10 epochs for the final phase


n_samples_per_input: 50
save_checkpoint_every_n_epochs: 1000

best_model:
  ema_alpha: 1.0  # No EMA smoothing; just track the best single checkpoint per the val metric.
  subdataset_aggregation: mean  # "global" = aggregate rates then compute composite (legacy);
                                # "mean" = per-subdataset composite, then average;
                                # "worst" = per-subdataset composite, then take worst.
  metrics:
    - name: val_rate_mean_violation_gap_pct_generated
      weight: 0.5
      direction: minimize
    - name: val_rate_1pct_gap_pct
      weight: 0.25
      direction: minimize
    - name: val_rate_5pct_gap_pct
      weight: 0.25
      direction: minimize
