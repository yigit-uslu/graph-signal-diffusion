# @package baseline
name: grw
_target_: graph_signal_diffusion.baselines.stock_price_forecasting.grw.GeometricRandomWalk
needs_training: true  # Needs to fit parameters from training data

# GRW parameters
device: cuda
n_samples: 20                   # Number of samples to generate per prediction
shrinkage_strength: 10.0        # Controls shrinkage toward global mean (k parameter)
min_samples_per_stock: 20       # Minimum samples required for per-stock estimation

# Evaluation-time settings (used by evaluate())
evaluation:
  structural_metrics: true       # Compute cross-stock & temporal structure diagnostics
  structural_max_lag: 2           # Max lag for autocorrelation of r² (keep ≤ T-2)
  structural_n_eigenvalues: 5     # Top-k eigenvalues of correlation matrix
  nll_metrics: true              # Compute per-trajectory NLL histograms + W1 distance
  log_every_n_batches: 10         # Print progress every N batches (0 = disable)
  plot_bins: 60                   # Histogram bins for NLL density plots
  plot_dpi: 150                   # DPI for saved figures
  plot_nll_log_x: true            # Log x-axis for NLL histograms (NLL is always
                                  # positive and right-skewed; log scale
                                  # reveals bulk and tail simultaneously)



# Shrinkage strength guidelines for ~2353 observations per stock:
#
# k       λ       Interpretation
# -----   ------  --------------------------------------------------
# 0       1.000   No shrinkage - pure MLE per stock
# 1       0.9996  Minimal shrinkage
# 10      0.9958  Very light (current default)
# 100     0.9592  Light shrinkage
# 1000    0.7018  Moderate shrinkage
# 2353    0.5000  Balanced - equal weight stock/global
# 5000    0.3200  Strong shrinkage
# 10000   0.1906  Very strong shrinkage
#
# Formula: λ = n_s / (n_s + k) where n_s is observations per stock
# Recommended sweep: [1, 100, 1000, 5000]