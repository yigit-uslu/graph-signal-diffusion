# @package dataset
# Inherits from sp500.yaml - only override what's different for cleaned data
defaults:
  - sp500  # Inherit all parameters from sp500.yaml
  - _self_

# Override name for this variant
name: sp500_cleaned

# Point to cleaned data directory
# root: ${hydra:runtime.cwd}/data/sp500/cleaned_drop_incomplete_min_coverage_0.95_corr_0.5
# This is the updated SP500 graph that uses stock fundamentals to compute the graph.
root: ${hydra:runtime.cwd}/data/sp500/cleaned_drop_incomplete_min_coverage_0.95_corr_0.6_sector_bonus_0.05
spectral_normalize_edge_weights: true

