# @package _global_
# PD expert training config for the wra_mega_outdoor_mid_density scenario.
# Use with: python -m graph_signal_diffusion.cli.wra.train_pd \
#               --config-name=pd_training/wra_mega_outdoor_mid_density
#
# r_min = 0.6 is a moderate constraint now, calibrated from channe_analyssi output:
#   
#   

defaults:
  - /scenario/wra_mega_outdoor_mid_density
  - /pd_training/defaults
  - _self_

training:
  batch_size: 1
  max_epochs: 10000

  r_min: 0.6  # moderate; see header for channel_analysis reference values

  alpha_dual: 0.2 # bumped up from 0.1
  convergence_warmup_epochs: 2000
  convergence_patience: 500

  # Relative change of std_lambda values in the most recent ${convergence_window} epochs must be below this threshold to consider training converged.
  dual_variance_threshold: 0.005 

  # Collect samples only at the end of training.
  sample_collection_interval: .inf

