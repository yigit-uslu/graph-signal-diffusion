# @package _global_
# PD expert training config for the wra_medium_high_density scenario.
# Use with: python -m graph_signal_diffusion.cli.wra.train_pd --config-name=pd_training/wra_medium_high_density

defaults:
  - /scenario/wra_medium_high_density
  - /pd_training/defaults
  - _self_

training:
  batch_size: 32
  max_epochs: 20000

  convergence_window: 500 # bumped up from 200.

  # Primal-dual hyperparameters
  r_min: 0.8
  alpha_dual: 0.05
  dual_momentum: 0.9 # increase the oscillation speed of dual dynamics


# pd_config_name, pd_run_key, and hydra output dirs are inherited from pd_training/defaults.
