# @package _global_
# PD expert training config for the wra_medium_low_density scenario.
# Use with: python -m graph_signal_diffusion.cli.wra.train_pd --config-name=pd_training/wra_medium_low_density

defaults:
  - /scenario/wra_medium_low_density
  - /pd_training/defaults
  - _self_

training:
  r_min: 1.0
  batch_size: 32
  alpha_dual: 0.05
  convergence_window: 1000
  convergence_patience: 200
  violation_fraction_on_model_avg_rates_threshold: 0.001

# pd_config_name, pd_run_key, and hydra output dirs are inherited from pd_training/defaults.
