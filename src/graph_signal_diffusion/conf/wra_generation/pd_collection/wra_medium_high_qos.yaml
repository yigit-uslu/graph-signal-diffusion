# @package _global_
# PD sample collection config for the wra_medium_high_qos scenario.
# Same channel as wra_medium but trained with r_min = 1.0 (tighter QoS).
# Use with:
#   python -m graph_signal_diffusion.cli.wra.build_diffusion_dataset \
#     --config-name=pd_collection/wra_medium_high_qos \
#     input_dir=/path/to/pd_run

defaults:
  - /pd_training/wra_medium_high_qos
  - /pd_collection/defaults
  - _self_

# All collection parameters match pd_collection/defaults exactly.
# No overrides needed for wra_medium_high_qos; provide ``input_dir=...`` on the CLI.
