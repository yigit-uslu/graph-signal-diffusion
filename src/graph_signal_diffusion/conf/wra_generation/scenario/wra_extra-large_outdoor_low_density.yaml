# @package _global_
# WRA extra-large outdoor low-density scenario.
#
# 1600 tx-rx links over a 14.0 km x 14.0 km area:
#   - Density ~ 8.2 pairs/km²
#   - TX-RX pairs span 20-100 m (LoS regime, path-loss exponent 2)
#   - TX-TX min spacing 50 m; deployment retries (V3) handle infeasible placements
#   - Bandwidth 40 MHz

defaults:
  - /scenario/defaults
  - _self_

name: wra_extra-large_outdoor_low_density


dataset:
  num_networks: 64
  n_links: 1600
  deployment_range: 14000.0  # metres


channel:
  min_tx_rx_distance: 20.0   # metres
  max_tx_rx_distance: 100.0  # metres
  min_tx_tx_distance: 50.0   # metres

  max_deployment_attempts: 1000
  max_recursion_depth: 5


system:
  bandwidth_Hz: 40e6
