# @package _global_
#
# Baseline comparison on SP500-cleaned with TaskV2.
#
# Usage (GRW only — no checkpoint needed):
#   conda run -n torch_env python -m graph_signal_diffusion.cli.compare_baselines \
#       --config-name compare_baselines_sp500
#
# Usage (GRW + Diffusion — supply diffusion checkpoint):
#   conda run -n torch_env python -m graph_signal_diffusion.cli.compare_baselines \
#       --config-name compare_baselines_sp500 \
#       baselines_to_compare='[grw,diffusion]' \
#       baselines.diffusion.checkpoint_path=outputs/.../best_model.pt
#
defaults:
  - dataset: sp500_cleaned
  - task: stock_price_forecasting_v2
  - baseline@baselines.grw: grw
  - baseline@baselines.diffusion: diffusion
  - plot_style: sp500_compare
  - wandb: baseline_eval
  - _self_

# GRW handles multi-sample generation internally (predict_ensemble), so the
# *dataset* must NOT wrap eval splits with ReplicatedDataset.  Setting
# n_samples_per_input=1 here as the initial default; compare_baselines.py
# rebuilds loaders per-baseline with the correct n_samples_per_input.
dataset:
  n_samples_per_input: 1

# Task n_samples_per_input is updated dynamically per-baseline in
# compare_baselines.py.  The value here is a safe default.
task:
  n_samples_per_input: ${baselines.grw.n_samples}

# Compare both baselines.  To run GRW only, override on CLI:
#   baselines_to_compare='[grw]'
baselines_to_compare: [grw, diffusion]
seed: 0

# Per-split batch limits for evaluation (null = use all batches)
eval_splits:
  # train-val: 10
  # val: null
  test: null

# Visualisation options
viz:
  nll_log_x: true   # logarithmic x-axis for NLL histograms (recommended:
                    # NLL is always positive and typically right-skewed)
  dump_plot_data: true  # save raw plot-data sidecars (.npz) next to every
                        # polished PDF so figures can be regenerated by
                        # `python -m graph_signal_diffusion.cli.replot_baselines`
                        # without re-running evaluation.

# Paper-ready figure controls (Fig 1: per-window forecast columns).
# Consumed by the SP500 task's dedicated paper-figure plotters; a no-op for
# tasks/baselines that ignore it.  Emits single-column figures (n_stocks rows
# sharing the x-axis) to <run_dir>/eval_viz/paper/, one per test window, so a
# few can later be hand-picked and stacked side by side.  Existing diagnostic
# plots are unaffected.
paper_figures:
  enabled: true
  # Behavioral knobs ONLY.  Figure AESTHETICS (sizes, dpi, fonts, colors) live in
  # conf/plot_style/sp500_compare.yaml under plot_style.plots.{stock_prices,
  # structural_comparison, nll_comparison}, so they apply identically whether a
  # figure is drawn in a live run or regenerated from sidecars by replot.
  fig1:
    baseline: diffusion             # only this baseline emits forecast columns
    n_stocks: 3                     # rows per single-column figure
    max_panels: 6                   # cap on figures emitted (pick a few later)
    vary_stocks_per_window: true    # fresh random stocks per window for variety
    seed: 42
  fig2:
    max_lag: null            # null -> inherit pipeline structural_max_lag (=2 -> lags 1,2)
    n_eigenvalues: null      # null -> inherit pipeline structural_n_eigenvalues
    normalize: true          # true -> normalized ACF rho_l = gamma_l/gamma_0 in [-1,1]
    include_lag0: false      # drop lag 0 (rho_0=1); show the lag>=1 (clustering) signal
    show_iqr: true           # per-stock 25-75% error bars on the median
    twin_axis: false         # single shared y-axis (r & r2 comparable when normalized)
  fig3:
    log_x: null              # null -> inherit viz.nll_log_x
    bins: 60
    grw_per_element_nats: true  # GRW NLL (summed over N*T) -> per-(stock,step) nats
                                # so the row reads against the Gaussian floor ~1.42
    diffusion_per_step_mse: true  # diffusion proxy (= num_timesteps * mean MSE)
                                  # -> per-element denoising MSE (L_simple scale)

# Cross-baseline comparison plot colors (used for structural/NLL comparisons).
# Keys are baseline names; matching is case-insensitive.
comparison_plot:
  baseline_colors:
    grw: darkgreen
    diffusion: "#ff7f0e"

hydra:
  run:
    dir: outputs/${task.name}-${dataset.name}/comparison/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/${task.name}-${dataset.name}/comparison/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
