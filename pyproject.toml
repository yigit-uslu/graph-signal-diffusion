[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-signal-diffusion"
version = "0.0.0"
description = "Graph Signal Generative Diffusion Modeling"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "networkx>=2.8.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.4.0",
    "tqdm>=4.65.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",
    "jaxtyping>=0.3.0",
    "beartype>=0.22.0",
    "accelerate>=1.0.0",
    "wandb>=0.16.0",
    "torchvision>=0.15.0",
    "yfinance>=1.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
wra-analyze-channels        = "graph_signal_diffusion.cli.wra.analyze_channels:main"
wra-train-pd                = "graph_signal_diffusion.cli.wra.train_pd:main"
wra-build-diffusion-dataset = "graph_signal_diffusion.cli.wra.build_diffusion_dataset:main"
wra-verify-pd-samples       = "graph_signal_diffusion.cli.wra.verify_pd_samples:main"
stock-download              = "graph_signal_diffusion.cli.stock.download:main"
stock-update-stocks         = "graph_signal_diffusion.cli.stock.update_stocks:main"
stock-analyze-dates         = "graph_signal_diffusion.cli.stock.analyze_dates:main"
stock-clean                 = "graph_signal_diffusion.cli.stock.clean:main"
stock-sweep-static-graph    = "graph_signal_diffusion.cli.stock.sweep_static_graph:main"
stock-sweep-dynamic-graph   = "graph_signal_diffusion.cli.stock.sweep_dynamic_graph:main"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=graph_signal_diffusion",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: unit tests",
    "integration: integration tests",
]