<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1100"
     font-family="Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10"
            refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
    <marker id="res-arrow" markerWidth="10" markerHeight="10"
            refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#bd8a3e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18"/>
    </filter>
    <style>
      .sub { font-size: 0.65em; baseline-shift: sub; }
      .sup { font-size: 0.65em; baseline-shift: super; }
      .dim { font-size: 12px; fill: #ddd; }
      .small { font-size: 11px; fill: #ddd; }
      .note { font-size: 11px; fill: #888; font-style: italic; }
    </style>
  </defs>

  <text x="750" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">
    U-GNN denoiser — sophisticated-oarfish-9 (inner units)
  </text>
  <text x="750" y="62" text-anchor="middle" font-size="13" fill="#555">
    ResidualGNNBlock with Strided TAGConv &#160;|&#160; v3 NodeSelector &#160;|&#160; Conditional encoder (T<tspan class="sub">cond</tspan>=1, collapsed to an MLP)
  </text>

  <!-- ===================== ResidualGNNBlock ===================== -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="700" height="470" rx="18" fill="#f6f3ff" stroke="#3a397e" stroke-width="1.5"/>
    <text x="350" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#3a397e">
      ResidualGNNBlock with Strided TAGConv (K = 2)
    </text>
    <text x="350" y="52" text-anchor="middle" class="note" fill="#666">
      hidden_channels = 64 at every level &#160;|&#160; &#947;<tspan class="sub">eff</tspan> = stride<tspan class="sub">pre</tspan>, capped at max_gnn_stride = 2
    </text>

    <!-- Input -->
    <rect x="250" y="80" width="200" height="46" rx="10" fill="#3a3a3a" filter="url(#shadow)"/>
    <text x="350" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="white">x &#160;(B, 1, N, 64)</text>

    <!-- Strided TAGConv -->
    <rect x="100" y="160" width="500" height="86" rx="10" fill="#3a397e" filter="url(#shadow)"/>
    <text x="350" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
      Strided TAGConv (K = 2, power_mode = a_plus_i)
    </text>
    <text x="350" y="208" text-anchor="middle" class="dim">
      h<tspan class="sub">out</tspan> = &#931;<tspan class="sub">k=0..2</tspan> &#920;<tspan class="sub">k</tspan> &#183; (A + I)<tspan class="sup">k&#183;&#947;<tspan class="sub">eff</tspan></tspan> x
    </text>
    <text x="350" y="226" text-anchor="middle" class="small">
      L0: &#947;<tspan class="sub">eff</tspan>=1 (1, A+I, (A+I)<tspan class="sup">2</tspan>)
      &#160;|&#160; L1: &#947;<tspan class="sub">eff</tspan>=1
      &#160;|&#160; L2 / Bottleneck: &#947;<tspan class="sub">eff</tspan>=2 (1, (A+I)<tspan class="sup">2</tspan>, (A+I)<tspan class="sup">4</tspan>)
    </text>

    <!-- Norm/Act/Drop -->
    <rect x="250" y="270" width="200" height="46" rx="10" fill="#5a59a3" filter="url(#shadow)"/>
    <text x="350" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="white">LayerNorm</text>

    <rect x="250" y="334" width="200" height="46" rx="10" fill="#5a59a3" filter="url(#shadow)"/>
    <text x="350" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="white">SiLU</text>

    <rect x="250" y="398" width="200" height="46" rx="10" fill="#5a59a3" filter="url(#shadow)"/>
    <text x="350" y="426" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Dropout p=0.05</text>

    <!-- Residual sum -->
    <circle cx="560" cy="270" r="14" fill="#bd8a3e" stroke="white" stroke-width="2"/>
    <text x="560" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="white">+</text>

    <!-- Output -->
    <text x="350" y="462" text-anchor="middle" font-size="13" fill="#3a397e" font-weight="bold">
      out = x + Drop(SiLU(LN(StridedTAGConv(x))))
    </text>

    <!-- Arrows -->
    <line x1="350" y1="126" x2="350" y2="158" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="350" y1="246" x2="350" y2="268" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="350" y1="316" x2="350" y2="332" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="350" y1="380" x2="350" y2="396" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Residual: input down to sum -->
    <path d="M 450 103 C 560 103, 560 200, 560 256" stroke="#bd8a3e" stroke-width="2.2"
          fill="none" stroke-dasharray="6,4" marker-end="url(#res-arrow)"/>
    <path d="M 450 421 C 560 421, 560 310, 560 288" stroke="#bd8a3e" stroke-width="2.2"
          fill="none" stroke-dasharray="6,4" marker-end="url(#res-arrow)"/>
  </g>

  <!-- ===================== v3 NodeSelector ===================== -->
  <g transform="translate(760, 90)">
    <rect x="0" y="0" width="700" height="470" rx="18" fill="#eef9f3" stroke="#1d5a4a" stroke-width="1.5"/>
    <text x="350" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d5a4a">
      NodeSelector v3 (learned pooling, used at Levels 1 &amp; 2 only)
    </text>
    <text x="350" y="52" text-anchor="middle" class="note" fill="#666">
      cond_fusion_mode = add &#160;|&#160; time_emb_dim = 128 &#160;|&#160; selection_mode = ste
    </text>

    <!-- Inputs -->
    <rect x="40" y="78" width="180" height="56" rx="10" fill="#3a3a3a" filter="url(#shadow)"/>
    <text x="130" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="white">node_repr (B, 1, N, 64)</text>
    <text x="130" y="120" text-anchor="middle" class="small">post-GNN, post-mask</text>

    <rect x="260" y="78" width="180" height="56" rx="10" fill="#4d3e1f" filter="url(#shadow)"/>
    <text x="350" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="white">cond_feats (B, 1, N, 64)</text>
    <text x="350" y="120" text-anchor="middle" class="small">block-projected cond</text>

    <rect x="480" y="78" width="180" height="56" rx="10" fill="#444" filter="url(#shadow)"/>
    <text x="570" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="white">time_emb (B, 128)</text>
    <text x="570" y="120" text-anchor="middle" class="small">sinusoidal</text>

    <!-- temporal reduce (T=1 -> trivial, but shown for completeness) -->
    <rect x="40" y="160" width="180" height="54" rx="10" fill="#5a59a3"/>
    <text x="130" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="white">temporal_reduce = mean</text>
    <text x="130" y="204" text-anchor="middle" class="small">trivial at T=1 &#8594; (B, N, 64)</text>

    <!-- cond_projection: Identity (cond_dim==in_channels=64) -->
    <rect x="260" y="160" width="180" height="54" rx="10" fill="#bd8a3e"/>
    <text x="350" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="white">cond_projection</text>
    <text x="350" y="202" text-anchor="middle" class="small">Identity (widths match)</text>

    <!-- time_film -->
    <rect x="480" y="160" width="180" height="54" rx="10" fill="#a55856"/>
    <text x="570" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="white">time_film</text>
    <text x="570" y="202" text-anchor="middle" class="small">SiLU &#8594; Linear 128 &#8594; 128</text>

    <!-- FiLM apply (split into γ, β) -->
    <rect x="40" y="240" width="320" height="54" rx="10" fill="#5a59a3"/>
    <text x="200" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="white">node_repr &#8594; FiLM (&#947;, &#946;)</text>
    <text x="200" y="284" text-anchor="middle" class="small">split(64, 64); h = h &#8902; (1 + &#947;) + &#946;</text>

    <!-- cond add-bias path -->
    <rect x="380" y="240" width="280" height="54" rx="10" fill="#bd8a3e"/>
    <text x="520" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="white">cond_add_bias: Linear 64 &#8594; 1</text>
    <text x="520" y="284" text-anchor="middle" class="small">zero-init &#8594; cond_bias (B, N)</text>

    <!-- Score MLP -->
    <rect x="40" y="320" width="320" height="60" rx="10" fill="#1d5a4a" filter="url(#shadow)"/>
    <text x="200" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="white">score_proj: Linear 64 &#8594; 1</text>
    <text x="200" y="365" text-anchor="middle" class="small">node scores (B, N)</text>

    <!-- Sum -->
    <circle cx="400" cy="350" r="14" fill="#bd8a3e" stroke="white" stroke-width="2"/>
    <text x="400" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="white">+</text>

    <!-- Selection -->
    <rect x="440" y="320" width="220" height="60" rx="10" fill="#1d5a4a" filter="url(#shadow)"/>
    <text x="550" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="white">STE top-K (gumbel)</text>
    <text x="550" y="365" text-anchor="middle" class="small">temp linear: 1.0 &#8594; 0.50</text>

    <!-- Output -->
    <rect x="180" y="408" width="340" height="46" rx="10" fill="#3a3a3a" filter="url(#shadow)"/>
    <text x="350" y="437" text-anchor="middle" font-size="13" font-weight="bold" fill="white">
      new active_mask (B, N) &#160; ~50% True
    </text>

    <!-- Arrows -->
    <line x1="130" y1="134" x2="130" y2="158" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="350" y1="134" x2="350" y2="158" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="570" y1="134" x2="570" y2="158" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="130" y1="214" x2="130" y2="240" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="350" y1="214" x2="450" y2="240" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="570" y1="214" x2="300" y2="240" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="200" y1="294" x2="200" y2="318" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="360" y1="350" x2="386" y2="350" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="520" y1="294" x2="410" y2="338" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="414" y1="350" x2="438" y2="350" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="550" y1="380" x2="380" y2="406" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="350" y="466" text-anchor="middle" class="note">
      entropy_reg_weight = 0 &#8594; selector trained only by gradient through STE from the diffusion loss
    </text>
  </g>

  <!-- ===================== Conditional encoder (collapsed) ===================== -->
  <g transform="translate(40, 590)">
    <rect x="0" y="0" width="1420" height="480" rx="18" fill="#fdf9ef" stroke="#bd8a3e" stroke-width="1.5"/>
    <text x="710" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#a06f30">
      ConditionalTemporalMixerEmbedding &#8212; collapsed at T<tspan class="sub">cond</tspan> = 1
    </text>
    <text x="710" y="52" text-anchor="middle" class="note" fill="#666">
      `last_forward_short_circuited = True` &#8594; <tspan font-weight="bold">all TemporalDepthwiseMixer layers are skipped</tspan>; only the per-node Linear / MLP layers run
    </text>

    <!-- Cond input -->
    <rect x="40" y="80" width="240" height="76" rx="10" fill="#3a3a3a" filter="url(#shadow)"/>
    <text x="160" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="white">cond</text>
    <text x="160" y="128" text-anchor="middle" class="small">(B, 1, 400, 3)</text>
    <text x="160" y="146" text-anchor="middle" class="small">[direct_signal, total_interf, r_min]</text>

    <text x="160" y="180" text-anchor="middle" class="note">reshape &#8594; (B&#183;400, 1, 3)</text>

    <!-- input_proj of mixer block 0 (Linear 3→32) -->
    <rect x="320" y="80" width="240" height="120" rx="12" fill="#bd8a3e" filter="url(#shadow)"/>
    <text x="440" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
      input_projs[0]: Linear 3 &#8594; 32
    </text>
    <text x="440" y="128" text-anchor="middle" class="small">(B&#183;400, 1, 32)</text>
    <text x="440" y="158" text-anchor="middle" class="small" font-style="italic">
      TemporalDepthwiseMixer SKIPPED
    </text>
    <text x="440" y="178" text-anchor="middle" class="small" font-style="italic">
      (gated by T<tspan class="sub">cond</tspan> == 1 short-circuit)
    </text>

    <!-- Static pooling (last) -->
    <rect x="600" y="80" width="200" height="120" rx="12" fill="#bd8a3e" filter="url(#shadow)"/>
    <text x="700" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
      static pool: x[:, 0, :]
    </text>
    <text x="700" y="128" text-anchor="middle" class="small">(B&#183;400, 32)</text>
    <text x="700" y="158" text-anchor="middle" class="small" font-style="italic">
      EMA / mean / attention branches
    </text>
    <text x="700" y="178" text-anchor="middle" class="small" font-style="italic">
      bypassed at T<tspan class="sub">cond</tspan>=1
    </text>

    <!-- output_proj (MLPEmbedding) -->
    <rect x="840" y="80" width="280" height="120" rx="12" fill="#bd8a3e" filter="url(#shadow)"/>
    <text x="980" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
      output_proj: MLPEmbedding
    </text>
    <text x="980" y="128" text-anchor="middle" class="small">Linear 32 &#8594; 128</text>
    <text x="980" y="146" text-anchor="middle" class="small">SiLU + Dropout 0.05</text>
    <text x="980" y="164" text-anchor="middle" class="small">Linear 128 &#8594; 128</text>
    <text x="980" y="182" text-anchor="middle" class="small">(B&#183;400, 128)</text>

    <!-- Output -->
    <rect x="1160" y="80" width="240" height="76" rx="10" fill="#4d3e1f" filter="url(#shadow)"/>
    <text x="1280" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="white">cond_emb</text>
    <text x="1280" y="128" text-anchor="middle" class="small">(B, 400, 128) &#160;static</text>
    <text x="1280" y="146" text-anchor="middle" class="small">shared by all blocks</text>

    <!-- Arrows -->
    <line x1="280" y1="118" x2="318" y2="118" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="560" y1="118" x2="598" y2="118" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="800" y1="118" x2="838" y2="118" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="1120" y1="118" x2="1158" y2="118" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Effective view -->
    <text x="710" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06f30">
      Effective conditioning encoder (this run) = Linear(3 &#8594; 32) &#8594; SiLU &#8594; Linear(32 &#8594; 128) &#8594; SiLU &#8594; Linear(128 &#8594; 128) &#160;applied per node
    </text>

    <!-- Time embedding -->
    <g transform="translate(0, 280)">
      <rect x="40" y="0" width="240" height="76" rx="10" fill="#444" filter="url(#shadow)"/>
      <text x="160" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
        Sinusoidal time embed
      </text>
      <text x="160" y="46" text-anchor="middle" class="small">t &#8594; sinusoidal &#8594; (B, 128)</text>
      <text x="160" y="64" text-anchor="middle" class="small" font-style="italic">num_timesteps = 500</text>

      <text x="710" y="40" text-anchor="middle" font-size="13" fill="#222">
        delivered to every encoder/decoder block&#39;s time_proj AND to NodeSelector v3&#39;s time_film
      </text>
    </g>

    <!-- Notes -->
    <text x="710" y="395" text-anchor="middle" class="note">
      The mixer body (kernel = 3, dilation = 1, causal, no pointwise, 1 layer) is constructed but never executed for this dataset.
    </text>
    <text x="710" y="413" text-anchor="middle" class="note">
      cond_fusion_mode = concat &#8594; the cond_emb above is broadcast to each block&#39;s in_channels via per-block cond_proj, then concat-fused with x and time_token.
    </text>
    <text x="710" y="448" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06f30">
      Result: conditioning is a static (B, N, 128) tensor produced by a per-node 2-layer MLP.
    </text>
  </g>
</svg>
