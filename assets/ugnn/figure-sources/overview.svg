<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 980"
     font-family="Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10"
            refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
    <marker id="skip-arrow" markerWidth="10" markerHeight="10"
            refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#bd8a3e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18"/>
    </filter>
    <style>
      .sub { font-size: 0.65em; baseline-shift: sub; }
      .sup { font-size: 0.65em; baseline-shift: super; }
      .dim { font-size: 13px; fill: #ddd; }
      .lvl { font-size: 14px; fill: #aaa; font-style: italic; }
    </style>
  </defs>

  <!-- Title -->
  <text x="750" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">
    U-GNN denoiser — sophisticated-oarfish-9 (overview)
  </text>
  <text x="750" y="62" text-anchor="middle" font-size="14" fill="#555">
    WRA medium-large (N&#8776;400 transceivers) &#160;&#8226;&#160; T = 1, T<tspan class="sub">cond</tspan> = 1
    &#160;&#8226;&#160; base_channels = 64, multipliers = [1, 1, 1] &#160;&#8226;&#160; &#947; = [1, 2, 2] (learned spatial pyramid)
  </text>

  <!-- Level labels -->
  <text x="60"  y="190" class="lvl">Level 0 &#160; &#947;=1</text>
  <text x="60"  y="335" class="lvl">Level 1 &#160; &#947;=2</text>
  <text x="60"  y="480" class="lvl">Level 2 &#160; &#947;=2</text>
  <text x="60"  y="640" class="lvl">Bottleneck</text>

  <!-- ===================== INPUT ===================== -->
  <rect x="640" y="90" width="220" height="70" rx="14" fill="#3a3a3a" filter="url(#shadow)"/>
  <text x="750" y="118" text-anchor="middle" font-size="18" font-weight="bold" fill="white">
    Noisy power &#160;x<tspan class="sub">t</tspan>
  </text>
  <text x="750" y="142" text-anchor="middle" class="dim">(B, 1, 400, 1)</text>

  <!-- Input projection -->
  <rect x="640" y="180" width="220" height="48" rx="10" fill="#2c5d7e" filter="url(#shadow)"/>
  <text x="750" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
    Linear input proj &#160;1&#8594;64
  </text>
  <line x1="750" y1="160" x2="750" y2="178" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== ENCODER (left, purple) ===================== -->

  <!-- Enc 0 (no pool) -->
  <rect x="180" y="170" width="290" height="100" rx="14" fill="#3a397e" filter="url(#shadow)"/>
  <text x="325" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Encoder block 0</text>
  <text x="325" y="222" text-anchor="middle" class="dim">in 64 &#8594; out 64 &#160; (B, 1, 400, 64)</text>
  <text x="325" y="240" text-anchor="middle" class="dim">GNN&#215;2 (TAGConv K=2, &#947;<tspan class="sub">eff</tspan>=1)</text>
  <text x="325" y="258" text-anchor="middle" class="dim">no selector (skip_gamma1_levels)</text>

  <!-- Enc 1 (γ=2 with selector) -->
  <rect x="180" y="315" width="290" height="100" rx="14" fill="#3a397e" filter="url(#shadow)"/>
  <text x="325" y="345" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Encoder block 1</text>
  <text x="325" y="367" text-anchor="middle" class="dim">GNN&#215;2 (&#947;<tspan class="sub">eff</tspan>=1) &#160;+&#160; NodeSelector v3</text>
  <text x="325" y="385" text-anchor="middle" class="dim">400 active &#8594; ~200 active</text>
  <text x="325" y="403" text-anchor="middle" class="dim">(B, 1, 400, 64) &#160; stride<tspan class="sub">post</tspan>=2</text>

  <!-- Enc 2 (γ=2 with selector) -->
  <rect x="180" y="460" width="290" height="100" rx="14" fill="#3a397e" filter="url(#shadow)"/>
  <text x="325" y="490" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Encoder block 2</text>
  <text x="325" y="512" text-anchor="middle" class="dim">GNN&#215;2 (&#947;<tspan class="sub">eff</tspan>=2) &#160;+&#160; NodeSelector v3</text>
  <text x="325" y="530" text-anchor="middle" class="dim">~200 active &#8594; ~100 active</text>
  <text x="325" y="548" text-anchor="middle" class="dim">stride<tspan class="sub">pre</tspan>=2 &#8594; multi-scale conv</text>

  <!-- Encoder column arrows -->
  <line x1="325" y1="270" x2="325" y2="313" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="325" y1="415" x2="325" y2="458" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- From input proj into encoder column -->
  <path d="M 640 204 C 540 204, 480 220, 470 220"
        stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ===================== DECODER (right, brown) ===================== -->

  <!-- Dec 2 (innermost) -->
  <rect x="1030" y="460" width="290" height="100" rx="14" fill="#7e3a35" filter="url(#shadow)"/>
  <text x="1175" y="490" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Decoder block 2</text>
  <text x="1175" y="512" text-anchor="middle" class="dim">in 64 &#8853; skip 64 &#8594; out 64</text>
  <text x="1175" y="530" text-anchor="middle" class="dim">unpool zero-fill: ~100 &#8594; ~200 active</text>
  <text x="1175" y="548" text-anchor="middle" class="dim">GNN&#215;2 (&#947;<tspan class="sub">eff</tspan>=2)</text>

  <!-- Dec 1 -->
  <rect x="1030" y="315" width="290" height="100" rx="14" fill="#7e3a35" filter="url(#shadow)"/>
  <text x="1175" y="345" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Decoder block 1</text>
  <text x="1175" y="367" text-anchor="middle" class="dim">in 64 &#8853; skip 64 &#8594; out 64</text>
  <text x="1175" y="385" text-anchor="middle" class="dim">unpool zero-fill: ~200 &#8594; 400 active</text>
  <text x="1175" y="403" text-anchor="middle" class="dim">GNN&#215;2 (&#947;<tspan class="sub">eff</tspan>=1)</text>

  <!-- Dec 0 -->
  <rect x="1030" y="170" width="290" height="100" rx="14" fill="#7e3a35" filter="url(#shadow)"/>
  <text x="1175" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Decoder block 0</text>
  <text x="1175" y="222" text-anchor="middle" class="dim">in 64 &#8853; skip 64 &#8594; out 64</text>
  <text x="1175" y="240" text-anchor="middle" class="dim">no unpool (mask all-True)</text>
  <text x="1175" y="258" text-anchor="middle" class="dim">GNN&#215;2 (&#947;<tspan class="sub">eff</tspan>=1)</text>

  <!-- Decoder column arrows -->
  <line x1="1175" y1="458" x2="1175" y2="417" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1175" y1="313" x2="1175" y2="272" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== BOTTLENECK ===================== -->
  <rect x="600" y="600" width="300" height="110" rx="14" fill="#1d5a4a" filter="url(#shadow)"/>
  <text x="750" y="632" text-anchor="middle" font-size="18" font-weight="bold" fill="white">Bottleneck</text>
  <text x="750" y="655" text-anchor="middle" class="dim">3 &#215; GNN @ 64ch &#160; on ~100 active</text>
  <text x="750" y="675" text-anchor="middle" class="dim">TAGConv K=2, residual</text>
  <text x="750" y="694" text-anchor="middle" class="dim">&#947;<tspan class="sub">eff</tspan>=2 (capped by max_gnn_stride=2)</text>

  <!-- Encoder bottom into bottleneck -->
  <path d="M 325 560 C 325 650, 470 690, 600 690"
        stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- Bottleneck into decoder bottom -->
  <path d="M 900 690 C 1030 690, 1175 650, 1175 560"
        stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ===================== OUTPUT ===================== -->
  <rect x="640" y="810" width="220" height="48" rx="10" fill="#2c5d7e" filter="url(#shadow)"/>
  <text x="750" y="840" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
    Linear output proj &#160;64&#8594;1
  </text>

  <rect x="640" y="880" width="220" height="70" rx="14" fill="#3a3a3a" filter="url(#shadow)"/>
  <text x="750" y="908" text-anchor="middle" font-size="18" font-weight="bold" fill="white">
    Predicted noise &#160;&#x03B5;&#770;
  </text>
  <text x="750" y="932" text-anchor="middle" class="dim">(B, 1, 400, 1)</text>

  <!-- Dec 0 routes down through output_proj at the center -->
  <path d="M 1175 270 C 1175 770, 900 800, 860 832"
        stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <line x1="750" y1="858" x2="750" y2="878" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== SKIP CONNECTIONS ===================== -->
  <path d="M 470 220 C 700 220, 950 220, 1030 220"
        stroke="#bd8a3e" stroke-width="2.2" fill="none"
        stroke-dasharray="7,5" marker-end="url(#skip-arrow)"/>
  <path d="M 470 365 C 700 365, 950 365, 1030 365"
        stroke="#bd8a3e" stroke-width="2.2" fill="none"
        stroke-dasharray="7,5" marker-end="url(#skip-arrow)"/>
  <path d="M 470 510 C 700 510, 950 510, 1030 510"
        stroke="#bd8a3e" stroke-width="2.2" fill="none"
        stroke-dasharray="7,5" marker-end="url(#skip-arrow)"/>
  <text x="750" y="208" text-anchor="middle" font-size="12" fill="#a06f30" font-style="italic">
    skip (concat) &#8594; Linear (64+64 &#8594; 64) &#160; <tspan font-style="normal">compact-packed when mask &lt; all-True</tspan>
  </text>
  <text x="750" y="353" text-anchor="middle" font-size="12" fill="#a06f30" font-style="italic">
    skip from pre-pool (400 active, 64 ch)
  </text>
  <text x="750" y="498" text-anchor="middle" font-size="12" fill="#a06f30" font-style="italic">
    skip from pre-pool (~200 active, 64 ch)
  </text>

  <!-- ===================== AUXILIARY INPUTS ===================== -->
  <!-- Time embedding -->
  <rect x="40" y="720" width="240" height="60" rx="12" fill="#444" filter="url(#shadow)"/>
  <text x="160" y="745" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
    Sinusoidal time embed
  </text>
  <text x="160" y="765" text-anchor="middle" class="dim">t &#8594; (B, 128)</text>

  <!-- Conditioning encoder -->
  <rect x="40" y="800" width="240" height="100" rx="12" fill="#4d3e1f" filter="url(#shadow)"/>
  <text x="160" y="826" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
    Conditional encoder
  </text>
  <text x="160" y="846" text-anchor="middle" class="dim">cond (B, 1, 400, 3)</text>
  <text x="160" y="864" text-anchor="middle" class="dim">[signal, interference, r_min]</text>
  <text x="160" y="882" text-anchor="middle" class="dim">&#8594; (B, 400, 128) &#160; static</text>
  <text x="160" y="898" text-anchor="middle" font-size="11" fill="#888" font-style="italic">collapsed MLP (T<tspan class="sub">cond</tspan>=1)</text>

  <!-- Time arrows fan-out -->
  <line x1="180" y1="745" x2="245" y2="225" stroke="#888" stroke-width="1.6"
        stroke-dasharray="3,3" marker-end="url(#arrow)" opacity="0.65"/>
  <line x1="180" y1="745" x2="245" y2="370" stroke="#888" stroke-width="1.6"
        stroke-dasharray="3,3" marker-end="url(#arrow)" opacity="0.65"/>
  <line x1="180" y1="745" x2="245" y2="515" stroke="#888" stroke-width="1.6"
        stroke-dasharray="3,3" marker-end="url(#arrow)" opacity="0.65"/>
  <line x1="280" y1="755" x2="600" y2="670" stroke="#888" stroke-width="1.6"
        stroke-dasharray="3,3" marker-end="url(#arrow)" opacity="0.65"/>

  <!-- Cond arrows -->
  <line x1="280" y1="830" x2="470" y2="540" stroke="#bd8a3e" stroke-width="1.6"
        stroke-dasharray="3,3" marker-end="url(#skip-arrow)" opacity="0.75"/>
  <line x1="280" y1="830" x2="470" y2="395" stroke="#bd8a3e" stroke-width="1.6"
        stroke-dasharray="3,3" marker-end="url(#skip-arrow)" opacity="0.75"/>
  <line x1="280" y1="830" x2="470" y2="250" stroke="#bd8a3e" stroke-width="1.6"
        stroke-dasharray="3,3" marker-end="url(#skip-arrow)" opacity="0.75"/>

  <!-- Legend -->
  <g transform="translate(1330, 720)">
    <rect x="0" y="0" width="150" height="200" rx="10" fill="#ffffff" stroke="#ccc"/>
    <text x="75" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Legend</text>

    <rect x="10" y="34" width="22" height="14" fill="#3a397e"/>
    <text x="38" y="46" font-size="11" fill="#333">Encoder block</text>

    <rect x="10" y="54" width="22" height="14" fill="#7e3a35"/>
    <text x="38" y="66" font-size="11" fill="#333">Decoder block</text>

    <rect x="10" y="74" width="22" height="14" fill="#1d5a4a"/>
    <text x="38" y="86" font-size="11" fill="#333">Bottleneck</text>

    <rect x="10" y="94" width="22" height="14" fill="#2c5d7e"/>
    <text x="38" y="106" font-size="11" fill="#333">Linear proj</text>

    <rect x="10" y="114" width="22" height="14" fill="#4d3e1f"/>
    <text x="38" y="126" font-size="11" fill="#333">Cond encoder</text>

    <line x1="10" y1="142" x2="32" y2="142" stroke="#bd8a3e" stroke-width="2.2" stroke-dasharray="5,4"/>
    <text x="38" y="146" font-size="11" fill="#333">Skip / cond</text>

    <line x1="10" y1="162" x2="32" y2="162" stroke="#888" stroke-width="2"/>
    <text x="38" y="166" font-size="11" fill="#333">Forward</text>

    <text x="75" y="190" text-anchor="middle" font-size="11" fill="#333" font-style="italic">
      no temporal mixer
    </text>
  </g>
</svg>
